version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
        exclude-patterns:
        - torch*
        - transformers
        - accelerate
        - vllm
        - unsloth*
        - openai
    cooldown:
      default-days: 3

  # Python (pip) dependencies
  - package-ecosystem: "pip"
    directory: "/examples/hello-mesh"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
        exclude-patterns:
        - torch*
        - transformers
        - accelerate
        - vllm
        - unsloth*
        - openai
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3

  # --- Added by supply-chain hygiene patch (Kallpa e48656eb, 2026-11-19) ---
  # Dockerfile base images (python:*-slim digest pins are bumped by Dependabot)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    # Ignore-hold 2026-11-19: python:*-slim ships no Rust/cargo toolchain and
    # mesh-command's hash-locked install has no cp315 pydantic-core wheel, so
    # #105 fails the runtime-contract build; #104 establishes only that /lab's
    # base bump is green.
    # Lift once every hash-locked Dockerfile install succeeds on 3.15-slim.
    ignore:
      - dependency-name: "python"
        versions:
          - ">= 3.15"

  - package-ecosystem: "docker"
    directory: "/lab"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    # Ignore-hold 2026-11-19: python:*-slim ships no Rust/cargo toolchain and
    # mesh-command's hash-locked install has no cp315 pydantic-core wheel, so
    # #105 fails the runtime-contract build; #104 establishes only that /lab's
    # base bump is green.
    # Lift once every hash-locked Dockerfile install succeeds on 3.15-slim.
    ignore:
      - dependency-name: "python"
        versions:
          - ">= 3.15"

  # Runtime requirement files that ship in the images (root *.txt incl. hashed lock, and /lab)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3

  - package-ecosystem: "pip"
    directory: "/lab"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
