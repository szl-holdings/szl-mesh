name: Receipt Gate Boundary

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  receipt-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - name: Verify malformed receipts and real signer identity
        run: python -m pytest -q tests/test_receipt_shapes.py tests/test_receipt_signer_identity.py tests/test_runtime.py
