name: SZL Mesh Command CI

on:
  pull_request:
    branches: [main]
    paths:
      - "mesh_command/**"
      - "tests/test_mesh_command.py"
      - "requirements-mesh-command*.txt"
      - "Dockerfile.mesh-command"
      - ".github/workflows/mesh-command-ci.yml"
      - "docs/MESH_COMMAND.md"
  push:
    branches: [main]
    paths:
      - "mesh_command/**"
      - "tests/test_mesh_command.py"
      - "requirements-mesh-command*.txt"
      - "Dockerfile.mesh-command"
      - ".github/workflows/mesh-command-ci.yml"
      - "docs/MESH_COMMAND.md"

permissions:
  contents: read

concurrency:
  group: szl-mesh-command-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: mesh-command/source-native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-mesh-command-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-mesh-command-dev.txt
      - name: Compile and test convergence engine
        run: |
          python -I -P -m py_compile mesh_command/app.py
          python -m pytest -q tests/test_mesh_command.py
      - name: Verify local-only frontend and no effectors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path("mesh_command")
          html = (root / "static/index.html").read_text(encoding="utf-8")
          js = (root / "static/app.js").read_text(encoding="utf-8")
          css = (root / "static/styles.css").read_text(encoding="utf-8")
          source = (root / "app.py").read_text(encoding="utf-8")

          forbidden_frontend = (
              "https://", "http://", "localStorage", "sessionStorage",
              "document.cookie", "WebSocket(", "EventSource(", "eval(",
          )
          found = [item for item in forbidden_frontend if item in html or item in js]
          if found:
              raise SystemExit(f"forbidden frontend capability: {found}")

          required_css = (
              "prefers-reduced-motion", "prefers-contrast", "forced-colors", "@media print"
          )
          missing = [item for item in required_css if item not in css]
          if missing:
              raise SystemExit(f"missing adaptive contract: {missing}")

          forbidden_backend = (
              "subprocess", "socket.", "requests.", "urllib.request",
              "os.system", "paramiko", "kubectl", "docker push",
          )
          found = [item for item in forbidden_backend if item in source]
          if found:
              raise SystemExit(f"forbidden mesh effector: {found}")
          print("mesh authority boundary: PASS")
          PY
      - name: Verify patch hygiene
        run: git diff --check

  container:
    name: mesh-command/non-root-container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build image
        run: docker build --file Dockerfile.mesh-command --tag szl-mesh-command:${{ github.sha }} .
      - name: Verify non-root declaration
        run: test "$(docker image inspect szl-mesh-command:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
