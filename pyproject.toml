[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-mesh"
version = "0.1.0"
description = "SZL-MESH node runtime: convergent CRDT + two-track state + doctrine-pinned DSSE receipts + doctrine-gated enrollment. Doctrine v11 LOCKED 749/14/163 @ c7c0ba17."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
# PCGI spine (T302): fold mesh state transitions onto the org-canonical
# szl-receipt binding. Optional so the base runtime stays cryptography-only;
# pinned the same >= way as the core cryptography dep.
spine = ["szl-receipt>=0.2.0"]

[project.scripts]
szl-mesh-demo = "szl_mesh.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
