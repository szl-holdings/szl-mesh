[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-mesh"
version = "0.1.0"
description = "SZL-MESH node runtime: convergent CRDT + two-track state + doctrine-pinned DSSE receipts + doctrine-gated enrollment. Doctrine v11 LOCKED 749/14/163 @ c7c0ba17."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["cryptography>=49.0.0"]
readme = "README.md"

[project.optional-dependencies]
# PCGI spine (T302): fold mesh state transitions onto the org-canonical
# szl-receipt binding. Optional so the base runtime stays cryptography-only;
# pinned the same >= way as the core cryptography dep.
spine = ["szl-receipt-dsse>=0.3.1"]

[project.scripts]
szl-mesh-demo = "szl_mesh.demo:main"

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-mesh"
Source = "https://github.com/szl-holdings/szl-mesh"
Issues = "https://github.com/szl-holdings/szl-mesh/issues"
Changelog = "https://github.com/szl-holdings/szl-mesh/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.szl.release]
import_names = ["sovereign", "szl_mesh"] # wheel top-level import names; the release gate fails if the built wheel differs
